name: GoCart Continuous Integration

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

permissions:
  contents: read

jobs:
  validate-and-test:
    name: Build, Typecheck & Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun Environment
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Cache Bun Install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma Client
        run: bun prisma generate

      - name: Run ESLint
        run: bun run lint

      - name: Check Formatting
        run: bun run check:format

      - name: Run TypeScript Typecheck
        run: bun run typecheck

      - name: Run Whole-Project Vitest Test Suite
        run: bun run test

      - name: Validate Next.js Production Build
        run: bun run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_CLOUDINARY_CLOUD_PRESET: ${{ vars.NEXT_PUBLIC_CLOUDINARY_CLOUD_PRESET }}

  e2e-public-smoke:
    name: Public E2E Smoke (Test Environment Only)
    if: ${{ vars.E2E_BASE_URL != '' && vars.E2E_ENVIRONMENT == 'test' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun Environment
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Cache Bun Install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: Run Public Smoke Tests
        run: bun run test:e2e
        env:
          PLAYWRIGHT_BASE_URL: ${{ vars.E2E_BASE_URL }}

      - name: Upload Playwright Report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore

  database-integration:
    name: Isolated Database Integration Checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gocart
          POSTGRES_PASSWORD: gocart
          POSTGRES_DB: gocart_e2e
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U gocart -d gocart_e2e"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      APP_ENV: local
      E2E_TEST_MODE: 'true'
      DATABASE_URL: postgresql://gocart:gocart@localhost:55432/gocart_e2e?schema=public
      E2E_DATABASE_URL: postgresql://gocart:gocart@localhost:55432/gocart_e2e?schema=public
      E2E_AUTH_MODE: test
      E2E_PROVIDER_MODE: sandbox
      EMAIL_NOTIFICATIONS_ENABLED: 'false'
      ABANDONED_CHECKOUT_EMAIL_ENABLED: 'false'
      DEMO_FULFILLMENT_AUTOMATION_ENABLED: 'false'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun Environment
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Cache Bun Install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma Client
        run: bun prisma generate

      - name: Apply Migrations
        run: bun x prisma migrate deploy

      - name: Seed Deterministic Integration Data
        run: bun prisma/seed-demo.ts

      - name: Run Database Integration Checks
        run: bun prisma/integration-check.ts

  e2e-protected-authorization:
    name: Protected E2E Authorization (Staging Only)
    if: ${{ vars.E2E_BASE_URL != '' && vars.E2E_ENVIRONMENT == 'staging' && vars.E2E_PROTECTED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun Environment
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Cache Bun Install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: Run Protected Authorization Tests
        run: bun run test:e2e:protected
        env:
          PLAYWRIGHT_BASE_URL: ${{ vars.E2E_BASE_URL }}
          E2E_PROTECTED: 'true'
          CLERK_PUBLISHABLE_KEY: ${{ vars.E2E_CLERK_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.E2E_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.E2E_CLERK_SECRET_KEY }}
          E2E_CUSTOMER_EMAIL: ${{ vars.E2E_CUSTOMER_EMAIL }}
          E2E_SELLER_EMAIL: ${{ vars.E2E_SELLER_EMAIL }}
          E2E_ADMIN_EMAIL: ${{ vars.E2E_ADMIN_EMAIL }}

      - name: Upload Protected Playwright Report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: protected-playwright-report
          path: playwright-report/
          if-no-files-found: ignore
